---
version: "2.0"

services:
  ghost:
    image: ghost:6.78.0
    expose:
      - port: 2368
        as: 80
        to:
          - global: true
    env:
      - NODE_ENV=production
      - database__client=mysql
      - database__connection__host=db
      - database__connection__port=3306
      - database__connection__user=ghost
      - database__connection__password=changeme
      - database__connection__database=ghost
    params:
      storage:
        blog-data:
          mount: /var/lib/ghost/content
          readOnly: false

  db:
    image: mysql:8.0
    env:
      - MYSQL_DATABASE=ghost
      - MYSQL_USER=ghost
      - MYSQL_PASSWORD=changeme
      - MYSQL_RANDOM_ROOT_PASSWORD=true
    expose:
      - port: 3306
        to:
          - service: ghost
    params:
      storage:
        db-data:
          mount: /var/lib/mysql
          readOnly: false

profiles:
  compute:
    ghost:
      resources:
        cpu:
          units: 1.0
        memory:
          size: 1Gi
        storage:
          - size: 5Gi
          - name: blog-data
            size: 6Gi
            attributes:
              persistent: true
              class: beta3

    db:
      resources:
        cpu:
          units: 1.0
        memory:
          size: 2Gi
        storage:
          - size: 5Gi
          - name: db-data
            size: 6Gi
            attributes:
              persistent: true
              class: beta3

  placement:
    akash:
      pricing:
        ghost:
          denom: uact
          amount: 10000
        db:
          denom: uact
          amount: 10000

deployment:
  ghost:
    akash:
      profile: ghost
      count: 1
  db:
    akash:
      profile: db
      count: 1
