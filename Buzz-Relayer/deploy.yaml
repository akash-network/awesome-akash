---
# Buzz Relay - Akash Network SDL
# https://github.com/block/buzz
#
# DEPLOY STEPS:
#   1. Fill in REPLACE_WITH_* values before deploying
#   2. Generate secrets with: openssl rand -hex 32
#      Run 3 times: DB password, Typesense API key, relay private key
#   3. WITH custom domain: set accept + RELAY_URL before deploying, point DNS to provider, deploy once
#   4. WITHOUT custom domain: deploy first, get provider URL, update RELAY_URL and redeploy
#   5. Connect desktop app to your relay URL (no trailing slash)

version: "2.0"

services:

  postgres:
    image: postgres:17-alpine
    expose:
      - port: 5432
        as: 5432
        proto: tcp
        to:
          - service: relay
    env:
      - POSTGRES_USER=buzz
      - POSTGRES_PASSWORD=REPLACE_WITH_DB_PASSWORD
      - POSTGRES_DB=buzz
      - PGDATA=/var/lib/postgresql/data/pgdata
    params:
      storage:
        postgres-data:
          mount: /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    expose:
      - port: 6379
        as: 6379
        proto: tcp
        to:
          - service: relay

  typesense:
    image: typesense/typesense:27.1
    env:
      - TYPESENSE_DATA_DIR=/typesense-data
      - TYPESENSE_API_KEY=REPLACE_WITH_TYPESENSE_API_KEY
      - TYPESENSE_LISTEN_PORT=8108
      - TYPESENSE_ENABLE_CORS=true
    expose:
      - port: 8108
        as: 8108
        proto: tcp
        to:
          - service: relay
    params:
      storage:
        typesense-data:
          mount: /typesense-data

  relay:
    image: rodrirr/buzz-relay:0.17
    expose:
      - port: 3000
        as: 80
        proto: tcp
        # Uncomment and set your domain to enable custom domain routing (required for wss:// and mobile pairing)
        # accept:
        #   - "REPLACE_WITH_YOUR_DOMAIN"
        to:
          - global: true
    env:
      - DATABASE_URL=postgres://buzz:REPLACE_WITH_DB_PASSWORD@postgres:5432/buzz
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=buzz
      - PGPASSWORD=REPLACE_WITH_DB_PASSWORD
      - PGDATABASE=buzz
      - REDIS_URL=redis://redis:6379
      - TYPESENSE_API_KEY=REPLACE_WITH_TYPESENSE_API_KEY
      - TYPESENSE_URL=http://typesense:8108
      - BUZZ_AUTO_MIGRATE=true
      # Relay identity key - generate with: openssl rand -hex 32
      - BUZZ_RELAY_PRIVATE_KEY=REPLACE_WITH_RELAY_PRIVATE_KEY
      # Owner pubkey - your Nostr hex pubkey shown in Buzz Desktop app
      - RELAY_OWNER_PUBKEY=REPLACE_WITH_OWNER_PUBKEY
      # Without custom domain: deploy first, get ws://provider:port, update and redeploy
      # With custom domain: set wss://yourdomain.com before first deploy
      - RELAY_URL=REPLACE_WITH_RELAY_URL
      # Required for mobile pairing - set to wss://yourdomain.com/pair (requires custom domain)
      # - BUZZ_PAIRING_RELAY_URL=wss://REPLACE_WITH_YOUR_DOMAIN/pair
      # Access control - uncomment to restrict relay to members only
      # - BUZZ_REQUIRE_RELAY_MEMBERSHIP=true
      # - BUZZ_REQUIRE_AUTH_TOKEN=true
      # Allow CORS from Tauri desktop app origins
      - BUZZ_CORS_ORIGINS=tauri://localhost,http://tauri.localhost
      - RUST_LOG=info
    params:
      storage:
        relay-repos:
          mount: /repos

profiles:
  compute:
    postgres:
      resources:
        cpu:
          units: 1.0
        memory:
          size: 1Gi
        storage:
          - size: 1Gi
          - name: postgres-data
            size: 10Gi
            attributes:
              persistent: true
              class: beta3
    redis:
      resources:
        cpu:
          units: 1.0
        memory:
          size: 256Mi
        storage:
          - size: 1Gi
    typesense:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          - size: 1Gi
          - name: typesense-data
            size: 5Gi
            attributes:
              persistent: true
              class: beta3
    relay:
      resources:
        cpu:
          units: 4.0
        memory:
          size: 8Gi
        storage:
          - size: 40Gi
          - name: relay-repos
            size: 40Gi
            attributes:
              persistent: true
              class: beta3

  placement:
    akash:
      pricing:
        postgres:
          denom: uact
          amount: 1000
        redis:
          denom: uact
          amount: 500
        typesense:
          denom: uact
          amount: 800
        relay:
          denom: uact
          amount: 2000

deployment:
  postgres:
    akash:
      profile: postgres
      count: 1
  redis:
    akash:
      profile: redis
      count: 1
  typesense:
    akash:
      profile: typesense
      count: 1
  relay:
    akash:
      profile: relay
      count: 1
