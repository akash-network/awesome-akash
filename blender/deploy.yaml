---
version: "2.0"

services:
  blender-web:
    image: linuxserver/blender:latest
    expose:
      - port: 3000
        as: 80
        http_options:
          max_body_size: 104857600
          read_timeout: 600000
          send_timeout: 600000
        to:
          - global: true
    env:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - CUSTOM_USER=changeme
      - PASSWORD=changeme-too
      - NVIDIA_DRIVER_CAPABILITIES=all
    params:
      storage:
        config:
          mount: /config

profiles:
  compute:
    blender-web:
      resources:
        cpu:
          units: 4
        memory:
          size: 16Gi
        storage:
          - size: 10Gi
          - name: config
            size: 20Gi
            attributes:
              persistent: true
              class: beta3
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:

  placement:
    akash:
      pricing:
        blender-web:
          denom: uact
          amount: 10000

deployment:
  blender-web:
    akash:
      profile: blender-web
      count: 1
