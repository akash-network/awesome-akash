---
  version: "2.0"
  services:
    ollama:
      image: ollama/ollama:latest
      expose:
        - port: 11434
          as: 11434
          to:
            - global: true
      command:
        - bash
        - "-lc"
      args:
        - |
          /bin/ollama serve &
          until /bin/ollama ps >/dev/null 2>&1; do sleep 1; done
          /bin/ollama pull llama3.2:3b
          wait
      params:
        tee: cpu-gpu
  profiles:
    compute:
      ollama:
        resources:
          cpu:
            units: 4
          memory:
            size: 16Gi
          storage:
            - size: 20Gi
          gpu:
            units: 1
            attributes:
              vendor:
                nvidia:
    placement:
      dcloud:
        pricing:
          ollama:
            denom: uact
            amount: 100000
        signedBy:
          anyOf:
            - akash1365yvmc4s7awdyj3n2sav7xfx76adc6dnmlx63
  deployment:
    ollama:
      dcloud:
        profile: ollama
        count: 1
