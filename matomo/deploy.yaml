---
version: "2.0"

services:
  db:
    image: mysql:9
    env:
      - MYSQL_ROOT_PASSWORD=awdnadpwbdnaiosd
      - MYSQL_DATABASE=matomo
      - MYSQL_USER=matomo
      - MYSQL_PASSWORD=mdabn9aodw908adsb9uoawd978asbi

    expose:
      - port: 3306
        to:
          - service: matomo
  matomo:
    image: matomo:apache
    expose:
      - port: 80
        as: 80
        to:
          - global: true
profiles:
  compute:
    db:
      resources:
        cpu:
          units: 1.0
        memory:
          size: 512Mi
        storage:
          size: 512Mi
    matomo:
      resources:
        cpu:
          units: 1.0
        memory:
          size: 512Mi
        storage:
          size: 512Mi
  placement:
    akash:
      attributes:
        host: akash
      pricing:
        db:
          denom: uact
          amount: 10000
        matomo:
          denom: uact
          amount: 10000
deployment:
  db:
    akash:
      profile: db
      count: 1
  matomo:
    akash:
      profile: matomo
      count: 1
